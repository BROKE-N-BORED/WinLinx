<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- WinLinx icon: a window (Windows) with a penguin (Linux) in front. Flat, bold shapes. -->
  <rect x="0" y="0" width="256" height="256" rx="52" fill="#EDF2F7"/>
  <!-- window: blue frame, four panes (top-left tinted) -->
  <rect x="36" y="30" width="184" height="148" rx="14" fill="#1B6EC2"/>
  <rect x="46" y="40" width="72" height="58" fill="#7FC4FD"/>
  <rect x="128" y="40" width="82" height="58" fill="#FFFFFF"/>
  <rect x="46" y="108" width="72" height="60" fill="#FFFFFF"/>
  <rect x="128" y="108" width="82" height="60" fill="#FFFFFF"/>
  <!-- penguin flippers -->
  <ellipse cx="78" cy="198" rx="12" ry="26" fill="#141414" transform="rotate(18 78 198)"/>
  <ellipse cx="178" cy="198" rx="12" ry="26" fill="#141414" transform="rotate(-18 178 198)"/>
  <!-- penguin body -->
  <ellipse cx="128" cy="192" rx="54" ry="46" fill="#141414"/>
  <!-- belly -->
  <ellipse cx="128" cy="206" rx="30" ry="30" fill="#FFFFFF"/>
  <!-- eyes -->
  <circle cx="112" cy="180" r="8" fill="#FFFFFF"/>
  <circle cx="144" cy="180" r="8" fill="#FFFFFF"/>
  <circle cx="112" cy="180" r="4" fill="#141414"/>
  <circle cx="144" cy="180" r="4" fill="#141414"/>
  <!-- beak -->
  <polygon points="118,190 138,190 128,202" fill="#F59E0B" stroke="#F59E0B" stroke-width="4" stroke-linejoin="round"/>
  <!-- feet -->
  <ellipse cx="106" cy="240" rx="15" ry="7" fill="#F59E0B"/>
  <ellipse cx="150" cy="240" rx="15" ry="7" fill="#F59E0B"/>
</svg>
