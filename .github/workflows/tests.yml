name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1
      - name: Install PySide6
        run: pip install PySide6-Essentials
      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd tests
          python -m unittest discover -v
      - name: Build the release zip from a clean checkout
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 build_zip.py
